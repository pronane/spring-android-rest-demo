# Publishes the static gallery in adare-fantasy/docs to GitHub Pages.
#
# The app itself cannot run on Pages — no Node, no cookies, no database — so this
# deploys screenshots and a frozen JSON snapshot (see adare-fantasy/DEPLOY.md).
#
# Pages is switched on automatically where the workflow token is allowed to do it
# (`enablement: true` below). Where it is not, the run stays green, the gallery is
# still validated, and the summary says which one setting to change:
# Settings → Pages → Source: "GitHub Actions".

name: Twenty-Eight static gallery

on:
  push:
    branches: [master]
    paths:
      - "adare-fantasy/docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      # No dependencies to install: the gallery has no build step, so the check is
      # the same script CI runs (`npm run docs:check`).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the gallery is self-contained
        run: node scripts/check-docs.mjs
        working-directory: adare-fantasy

      # Turns Pages on when the repository allows it; harmless when it is already
      # on. `continue-on-error` keeps a permissions refusal from failing the branch.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Pages is not available to this workflow
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### GitHub Pages is not available"
            echo
            echo "The gallery passed its checks but was not published. Enable it once:"
            echo "**Settings → Pages → Source: “GitHub Actions”**, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    if: needs.check.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: adare-fantasy/docs
      - id: deployment
        uses: actions/deploy-pages@v4
