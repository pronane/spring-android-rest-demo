name: Twenty-Eight CI
on:
  push:
    branches: [master, "claude/**"]
    paths: ["adare-fantasy/**", ".github/workflows/twenty-eight-ci.yml"]
  pull_request:
    paths: ["adare-fantasy/**", ".github/workflows/twenty-eight-ci.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adare-fantasy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adare-fantasy/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Scoring rules
        run: npm run scoring:check
      - name: Payments and the prize ledger
        run: npm run payments:check
      - name: Social sign-in rules
        run: npm run oauth:check
      - name: Static gallery (docs/) is self-contained
        run: npm run docs:check
      - name: The Codespace one-click still works
        run: npm run devcontainer:check
      - name: Build
        run: npm run build
      - name: Postgres backend (throwaway cluster, 27 assertions)
        run: npm run db:check
      - name: SQLite backend (throwaway file, the same 27 assertions)
        run: npm run db:check:sqlite
      - name: End-to-end in a browser (15 steps)
        run: npm run e2e
      - name: End-to-end on SQLite (15 steps, same product, one file)
        run: |
          npm run db:migrate -- --url=file:.data/ci.sqlite
          LIBSQL_URL=file:.data/ci.sqlite npm run e2e
